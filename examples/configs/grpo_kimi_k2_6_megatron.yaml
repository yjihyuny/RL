defaults: grpo_math_1B_megatron.yaml

# Conservative Kimi K2.6 GRPO smoke for HSG GB200:
#   16 nodes x 4 GPUs = 64 GPUs
#   Megatron TP8 / PP8 / EP8 / ETP1
#   vLLM TP8 / EP64 colocated generation

grpo:
  num_prompts_per_step: 1
  num_generations_per_prompt: 2
  max_num_steps: 1
  val_period: -1
  val_at_start: false
  val_at_end: false
  skip_reference_policy_logprobs_calculation: true

loss_fn:
  # Keep the first fit smoke policy-only. Raise to 0.01 after rollout/training
  # passes if you want reference-policy KL coverage.
  reference_policy_kl_penalty: 0.0

checkpointing:
  enabled: false
  checkpoint_dir: results/grpo-kimi-k2-6-megatron

policy:
  model_name: moonshotai/Kimi-K2.6
  tokenizer:
    name: ${policy.model_name}
    trust_remote_code: true
    chat_template: default
    chat_template_kwargs: null

  hf_config_overrides:
    architectures:
      - KimiK25ForConditionalGeneration

  train_global_batch_size: 2
  train_micro_batch_size: 1
  generation_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 1024
  precision: bfloat16
  offload_optimizer_for_logprob: false

  dtensor_cfg:
    enabled: false

  dynamic_batching:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64

  sequence_packing:
    enabled: true
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: modified_first_fit_decreasing
    sequence_length_round: 64

  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}
  optimizer: null

  megatron_cfg:
    enabled: true
    force_reconvert_from_hf: false
    empty_unused_memory_level: 2
    activation_checkpointing: true
    recompute_granularity: full
    recompute_modules: null
    tensor_model_parallel_size: 8
    pipeline_model_parallel_size: 8
    expert_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    num_layers_in_first_pipeline_stage: 7
    num_layers_in_last_pipeline_stage: 6
    context_parallel_size: 1
    sequence_parallel: true
    pipeline_dtype: ${policy.precision}
    apply_rope_fusion: true
    defer_fp32_logits: true

    freeze_moe_router: true
    moe_router_dtype: fp64
    moe_router_load_balancing_type: none
    moe_router_bias_update_rate: 0.0
    moe_permute_fusion: true
    moe_enable_deepep: false
    moe_token_dispatcher_type: alltoall
    moe_shared_expert_overlap: false

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: true
      overlap_param_gather: false
      use_custom_fsdp: false
      data_parallel_sharding_strategy: optim_grads_params

    fp8_cfg:
      enabled: false
      fp8: e4m3
      fp8_recipe: blockwise
      fp8_param: false

    optimizer:
      optimizer: adam
      lr: 1.0e-06
      min_lr: 1.0e-06
      weight_decay: 0.01
      bf16: true
      fp16: false
      params_dtype: float32
      main_params_dtype: fp16
      main_grads_dtype: bf16
      exp_avg_dtype: bf16
      exp_avg_sq_dtype: bf16
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1.0e-08
      sgd_momentum: 0.9
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      clip_grad: ${policy.max_grad_norm}
      optimizer_cpu_offload: true
      optimizer_offload_fraction: 0.70

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: constant
      lr_decay_style: constant
      lr_decay_iters: null
      lr_warmup_iters: 1
      lr_warmup_init: 1.0e-11

    env_vars: {}

  generation:
    backend: vllm
    max_new_tokens: 4
    temperature: 0.0
    top_p: 1.0
    top_k: null
    vllm_cfg:
      async_engine: false
      precision: ${policy.precision}
      kv_cache_dtype: auto
      tensor_parallel_size: 8
      pipeline_parallel_size: 1
      expert_parallel_size: 64
      gpu_memory_utilization: 0.90
      max_model_len: ${policy.max_total_sequence_length}
      skip_tokenizer_init: false
      enforce_eager: true
      enable_prefix_caching: false
      use_deep_gemm: false
      num_last_layers_in_bf16: 0
      num_first_layers_in_bf16: 0
      enable_vllm_metrics_logger: false
      vllm_metrics_logger_interval: 0.5
    vllm_kwargs:
      max_num_batched_tokens: 512
      max_num_seqs: 1
      moe_backend: triton
    colocated:
      enabled: true
      resources:
        gpus_per_node: null
        num_nodes: null

data:
  max_input_seq_length: 1020
  shuffle: true
  num_workers: 1
  train:
    dataset_name: OpenMathInstruct-2
    split_validation_size: 0.05
    seed: ${grpo.seed}
  validation: null
  default:
    prompt_file: examples/prompts/cot.txt
    system_prompt_file: null
    processor: math_hf_data_processor
    env_name: math

logger:
  log_dir: logs/grpo-kimi-k2-6-megatron
  num_val_samples_to_print: 0
  wandb_enabled: false
  tensorboard_enabled: false
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: false
  wandb:
    project: nemo-rl
    name: grpo-kimi-k2-6-megatron
  tensorboard:
    log_dir: tb_logs-grpo-kimi-k2-6-megatron
  mlflow:
    run_name: grpo-kimi-k2-6-megatron
  swanlab:
    project: nemo-rl
    name: grpo-kimi-k2-6-megatron

cluster:
  gpus_per_node: 4
  num_nodes: 16
